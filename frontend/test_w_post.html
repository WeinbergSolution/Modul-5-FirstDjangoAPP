<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const fetchGetUrl = "http://127.0.0.1:8000/tech_gadgets/gadget/1";
      const fetchPostUrl = "http://127.0.0.1:8000/tech_gadgets/gadget/";
      const fetchGetUrlManu =
        "http://127.0.0.1:8000/tech_gadgets/manufacturer/1";
      const fetchPostUrlManu =
        "http://127.0.0.1:8000/tech_gadgets/manufacturer/send_manufacturer/";

      async function fetchTestGet() {
        let result = await fetch(fetchGetUrl);
        let resultToText = await result.text();
        console.log(resultToText);
      }

      async function fetchTestGetManu() {
        let result = await fetch(fetchGetUrlManu);
        let resultToText = await result.text();
        console.log(resultToText);
      }

      async function fetchTestPost() {
        const data = { "test": "funktioniert" };

        let response = await fetch(fetchPostUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        let result = await response.json();
        console.log(result);
      }

      async function fetchTestPostManu() {
        const data = { "test": "funktioniert" };

        let response = await fetch(fetchPostUrlManu, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        let result = await response.json();
        console.log(result);
      }
    </script>
  </head>

  <body>
    <button onclick="fetchTestGet()">empfange gadget Daten</button>
    <button onclick="fetchTestPost()">Sende gadget Daten</button>
    <button onclick="fetchTestGetManu()">empfange manufacturer Daten</button>
    <button onclick="fetchTestPostManu()">Sende manufacturer Daten</button>
  </body>
</html>
